name: Release

# A tag v<version> builds the package and publishes it to PyPI as dotagent-web-research, with
# trusted publishing: no token is stored. pypi.org is told once, by the owner, to trust this
# repository, this workflow (release.yml) and the environment "pypi" for that project.
#
#   git tag v1.3.1 && git push origin v1.3.1

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the wheel and the sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' web_scraper/__init__.py)"
          test -n "${version}" || { echo "no __version__ in web_scraper/__init__.py"; exit 1; }
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "The tag ${GITHUB_REF_NAME} is not v${version}, the version of web_scraper"
            exit 1
          }
          grep -q "^version = \"${version}\"$" pyproject.toml || {
            echo "pyproject.toml does not say version ${version}"
            exit 1
          }
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dotagent-web-research
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
