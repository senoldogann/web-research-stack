[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The name on PyPI: "web-scraper" and "web-research-mcp" are taken there by others. The import
# package stays web_scraper, and so does the "web-scraper" command.
name = "dotagent-web-research"
version = "1.4.6"
description = "MCP server for web search and reading (search, scrape, map, extract, crawl) that Dot, an always-on agent for macOS, uses"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Senol Dogan", email = "senoldogan@users.noreply.github.com"}
]
keywords = ["mcp", "model-context-protocol", "web-search", "web-scraping", "crawler", "dot", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.26.0",
    "curl_cffi>=0.7.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.1.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pypdf>=5.1.0",
    # A page that the headless Chrome is turned away from (a bot check) is read once more in Camoufox. 0.5.8 is the
    # release whose browser and fingerprint model are named and checked by the package. It needs Python 3.10, and
    # it needs playwright older than 1.63 (docs/web-tools.md says what installing it brings). Not on an Intel Mac
    # (1.4.6): its fpgen needs indexed-zstd, which has no wheel for one, and building it needs Xcode's tools.
    "camoufox>=0.5.8; python_version >= '3.10' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "redis[hiredis]>=5.0.0",
    "trustme>=1.1.0",
]

playwright = [
    # 1.48 routes web sockets (BrowserContext.route_web_socket), which the browser's guard needs.
    "playwright>=1.48.0",
    "playwright-stealth>=1.0.6",
]

# The default Google path: a headless Firefox with a coherent fingerprint.
camoufox = [
    "camoufox[geoip]>=0.4.0",
]

redis = [
    "redis[hiredis]>=5.0.0",
]

[project.scripts]
# The MCP server Dot starts over stdio; web-scraper is the CLI and the REST server.
web-research-mcp = "web_scraper.mcp_server:main"
web-scraper = "web_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/senoldogann/web-research-stack"
Repository = "https://github.com/senoldogann/web-research-stack.git"
Issues = "https://github.com/senoldogann/web-research-stack/issues"
Documentation = "https://github.com/senoldogann/web-research-stack/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in argument defaults
    "UP006", # Use `dict` instead of `Dict` (Keep 3.9 compatibility)
    "UP035", # Use `dict` instead of `Dict` (Keep 3.9 compatibility)
    "UP007", # Use `X | Y` (Keep 3.9 compatibility)
    "UP045", # Use `X | None` (Keep 3.9 compatibility)
    "FA100", # Missing `from __future__ import annotations` (Optional for 3.9)
]

[tool.coverage.run]
source = ["web_scraper"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
